name: Publish

on:
  push:
    branches:
      - '**'
  pull_request:

# On branches/PRs, cancel superseded runs; never cancel a master run mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Hash-locked, wheels only: no setup scripts run and nothing resolves
      # to a version that wasn't reviewed (requirements-ci.in is the source).
      - run: "pip install --require-hashes --only-binary :all: -r requirements-ci.txt"
      - run: npm run lint
      - run: npm test
      - run: npm run audit

  build:
    runs-on: ubuntu-latest
    needs:
    - lint-and-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No npm cache here: this job's output is what gets published, and a
      # shared cache could be poisoned by another run.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      # The Font Awesome subset (assets/css/icons.css + static/fonts/
      # fa-*.subset.woff2) isn't committed: it's generated here from the
      # icons the source uses and the installed Font Awesome version, so a
      # new icon or a Dependabot bump needs no manual step.
      - name: Build the icon subset
        run: npm run build:icons

      - uses: lowply/build-hugo@v0.166.0

      - name: Check for broken links
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-ci.txt
          linkchecker public/index.html

      - name: Check SEO
        run: node scripts/lint-seo.js

      - name: Install browsers for smoke tests
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Browser smoke tests (Chromium + WebKit)
        run: npm run test:e2e
        env:
          E2E_WEBKIT: "1"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: website
          path: public/

  publish:
    runs-on: ubuntu-latest
    needs:
    - build
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download the website
        uses: actions/download-artifact@v8.0.2
        with:
          name: website
          path: public/
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_RJ_DEPLOY }}
          external_repository: red-jackets-jazzband/red-jackets-jazzband.github.io
          publish_branch: master
          publish_dir: ./public

  # The device-sync server (workers/sync, docs/device-sync-plan.md). Only on
  # master, and only when something under workers/sync changed.
  deploy-sync:
    runs-on: ubuntu-latest
    needs:
    - lint-and-test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did the sync server change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE" HEAD -- workers/sync; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Deploy
        if: steps.changed.outputs.changed == 'true'
        run: npx --yes wrangler@4.162.0 deploy --config workers/sync/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke check (an unknown vault answers 404)
        if: steps.changed.outputs.changed == 'true'
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors \
            "https://rj-sync.redjackets.workers.dev/v1/vault/$(printf '0%.0s' $(seq 64))")
          echo "GET of an unknown vault: HTTP $status"
          test "$status" = "404"
