name: Publish

on:
  push:
    branches:
      - '**'
  pull_request:

# On branches/PRs, cancel superseded runs; never cancel a master run mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Hash-locked, wheels only: no setup scripts run and nothing resolves
      # to a version that wasn't reviewed (requirements-ci.in is the source).
      - run: "pip install --require-hashes --only-binary :all: -r requirements-ci.txt"
      - run: npm run lint
      - run: npm test
      - run: npm run audit

  build:
    runs-on: ubuntu-latest
    needs:
    - lint-and-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lowply/build-hugo@v0.164.0

      - name: Check for broken links
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-ci.txt
          linkchecker public/index.html

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check SEO
        run: node scripts/lint-seo.js

      - name: Install browsers for smoke tests
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Browser smoke tests (Chromium + WebKit)
        run: npm run test:e2e
        env:
          E2E_WEBKIT: "1"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: website
          path: public/

  publish:
    runs-on: ubuntu-latest
    needs:
    - build
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download the website
        uses: actions/download-artifact@v8.0.1
        with:
          name: website
          path: public/
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_RJ_DEPLOY }}
          external_repository: red-jackets-jazzband/red-jackets-jazzband.github.io
          publish_branch: master
          publish_dir: ./public
