name: Publish

on:
  push:
    branches:
      - '**'
  pull_request:

# On branches/PRs, cancel superseded runs; never cancel a master run mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs:
    - lint-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: lowply/build-hugo@v0.164.0

      - name: Check for broken links
        run: |
          pip install linkchecker
          linkchecker public/index.html

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: website
          path: public/

  publish:
    runs-on: ubuntu-latest
    needs:
    - build
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
    steps:
      - name: Download the website
        uses: actions/download-artifact@v8.0.1
        with:
          name: website
          path: public/
      - name: Publish
        uses: tsunematsu21/actions-publish-gh-pages@v1.0.2
        with:
          dir: public
          repo: red-jackets-jazzband/red-jackets-jazzband.github.io
          branch: master
          token: ${{ secrets.GH_RJ_DEPLOY }}
