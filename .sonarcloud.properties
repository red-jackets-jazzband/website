# SonarCloud analysis scope and per-rule exceptions (read by automatic
# analysis; the same keys work in a sonar-project.properties if the project
# ever moves to a CI-driven scan). Explained in CLAUDE.md, "Keeping
# SonarCloud clean".

# themes/ is a vendored third-party theme (managed by dfetch, see dfetch.yaml)
# whose reset stylesheet / SCSS / video partial we don't author; the one
# thing we change in it lives in patches/. tests/fixtures/ is a static HTML
# mirror of the /songs/ page for jsdom, not shipped markup.
sonar.exclusions=themes/**,tests/fixtures/**

# This site supports Safari 12 (CLAUDE.md, "Browser support"), so a handful of
# "modernise this" suggestions are wrong here: each is a SyntaxError or a
# missing method on Safari 12 and is forbidden by eslint.config.js. They only
# apply to the browser-shipped code, not the Node-side scripts/ and tests/.
sonar.issue.ignore.multicriteria=optionalChain,arrayAt,replaceAll,hasOwn,selectedContent,ariaRole,ariaTabindex

# javascript:S6582 - "Prefer using an optional chain expression" (?. is a SyntaxError on Safari 12)
sonar.issue.ignore.multicriteria.optionalChain.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.optionalChain.resourceKey=static/script/**

# javascript:S7755 - "Prefer .at(...) over [...length - index]" (Safari 15.4+)
sonar.issue.ignore.multicriteria.arrayAt.ruleKey=javascript:S7755
sonar.issue.ignore.multicriteria.arrayAt.resourceKey=static/script/**

# javascript:S7781 - "Prefer String#replaceAll() over String#replace()" (Safari 13.1+)
sonar.issue.ignore.multicriteria.replaceAll.ruleKey=javascript:S7781
sonar.issue.ignore.multicriteria.replaceAll.resourceKey=static/script/**

# javascript:S6653 - "Use Object.hasOwn()" (Safari 15.4+)
sonar.issue.ignore.multicriteria.hasOwn.ruleKey=javascript:S6653
sonar.issue.ignore.multicriteria.hasOwn.resourceKey=static/script/**

# css:S4660 - unknown pseudo-element: ::selectedcontent / ::picker() are the
# customizable-<select> pseudo-elements, applied only inside an
# @supports (appearance: base-select) block.
sonar.issue.ignore.multicriteria.selectedContent.ruleKey=css:S4660
sonar.issue.ignore.multicriteria.selectedContent.resourceKey=assets/css/**

# Web:S6819 - "Prefer <dialog>/<input>/<fieldset>/<output> over an ARIA role" in the
# songs app shell. role="dialog" stays because <dialog> is Safari 15.4+ (see
# CLAUDE.md, "Browser support", fourth category); role="radio" is a segmented
# control of <button>s; role="group"/"status" sit on layout containers whose
# flex/inline styling a <fieldset>/<output> would change.
sonar.issue.ignore.multicriteria.ariaRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.ariaRole.resourceKey=layouts/shortcodes/songs-app.html

# Web:S6845 - tabindex on a role="group": the Inspiration loop overview strip is
# one deliberate focus stop handling arrow/Home/End keys (loopbar.js initOverview).
sonar.issue.ignore.multicriteria.ariaTabindex.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.ariaTabindex.resourceKey=layouts/shortcodes/songs-app.html
